palette:
  bg: "#f0ecf8"
  fg: "#1a1333"
  heading: "#c41858"
  accent: "#0088aa"
  code_bg: "#e0d8f0"
  muted: "#8866bb"
  hot_pink: "#c41858"
  neon_cyan: "#0077aa"
  neon_purple: "#7722bb"
  warm_yellow: "#b8860b"

slide:
  bg: "palette:bg"
  fg: "palette:fg"
  margin:
    left: 4
    right: 4
    top: 2
    bottom: 1

styles:
  heading:
    fg: "palette:hot_pink"
    bold: true
  code:
    fg: "palette:neon_cyan"
    bg: "palette:code_bg"
    padding: 2
  blockquote:
    fg: "palette:neon_purple"
    italic: true

highlights:
  key:
    fg: "palette:warm_yellow"
    bold: true
  jargon:
    fg: "palette:neon_purple"
    italic: true
  definition:
    fg: "palette:neon_cyan"
  emphasis:
    fg: "palette:hot_pink"
    bold: true
  warning:
    fg: "#cc2222"
    bold: true
  quote:
    fg: "palette:accent"
    italic: true
  dim:
    fg: "#aa99cc"

footer:
  fg: "palette:muted"
